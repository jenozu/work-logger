name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run typecheck
      - run: npm run build
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          WORK_LOGGER_PIN: "1234"
          SESSION_SECRET: ci-only-secret-not-for-production
